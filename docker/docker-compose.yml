version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: myprint_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: myprint
      POSTGRES_USER: myprint_user
      POSTGRES_PASSWORD: myprint_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myprint_user -d myprint"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: myprint_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: myprint_minio
      MINIO_ROOT_PASSWORD: myprint_minio_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: myprint_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  minio_data:
  redis_data:

